<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Voir la demande - Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        padding: 20px;
      }
      .card {
        max-width: 700px;
        margin: auto;
        background: white;
        border-radius: 8px;
        padding: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-bottom: 20px;
      }
      .info {
        margin-bottom: 15px;
      }
      .info label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .info span {
        display: block;
        background: #f1f3f5;
        padding: 10px;
        border-radius: 5px;
      }
      .btn {
        margin-top: 25px;
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Demande de devis – Jean Dupont</h2>

      <div class="info">
        <label>Nom</label>
        <span>Jean Dupont</span>
      </div>

      <div class="info">
        <label>Email</label>
        <span>jean.dupont@mail.com</span>
      </div>

      <div class="info">
        <label>Localisation du projet</label>
        <span>Bordeaux</span>
      </div>

      <div class="info">
        <label>Type de projet</label>
        <span>Ossature bois</span>
      </div>

      <div class="info">
        <label>Surface approximative</label>
        <span>120 m²</span>
      </div>

      <div class="info">
        <label>Délai souhaité</label>
        <span>Printemps 2026</span>
      </div>

      <div class="info">
        <label>Description du projet</label>
        <span
          >Extension d’une maison existante avec structure en bois. Besoin de grandes baies vitrées côté jardin.</span
        >
      </div>

      <a href="#" class="btn">Traiter / Éditer le devis</a>
    </div>
  </body>
</html>
